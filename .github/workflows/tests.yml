name: QA checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest tests/api --junitxml=reports/api-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/api-results.xml

  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run python data_quality/run_checks.py
      - run: uv run python data_quality/pandas_checks.py
      - run: uv run pytest tests/data --junitxml=reports/data-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-report
          path: reports/